name: Build iOS IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: OffGridChat-android-ios/OffGridChat/ios
        run: xcodegen
      - name: Build unsigned app
        working-directory: OffGridChat-android-ios/OffGridChat/ios
        run: |
          xcodebuild -project OffGridChat.xcodeproj -scheme OffGridChat \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OffGridChat.app Payload/
          zip -qr OffGridChat.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OffGridChat-ipa
          path: OffGridChat-android-ios/OffGridChat/ios/OffGridChat.ipa
